name: Validate JFire Scanner

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck client
        run: npm run typecheck
      - name: Typecheck server
        run: npm run typecheck:node
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
