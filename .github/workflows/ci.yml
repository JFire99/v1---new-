name: Validate JFire Scanner

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair WebSocket 406 reconnect handling
        shell: python
        run: |
          from pathlib import Path
          import re

          scanner = Path('src/scanner-engine.ts')
          text = scanner.read_text(encoding='utf-8')

          text = text.replace(
              "  private ws: WebSocket | null = null;\n  private auth = false;",
              "  private ws: WebSocket | null = null;\n  private auth = false;\n  private wsReconnectTimer: ReturnType<typeof setTimeout> | null = null;\n  private wsReconnectBlocked = false;\n  private wsReconnectAttempt = 0;\n  private wsStopping = false;"
          )

          text = text.replace(
              "    this.connectWs();\n\n    void this.scan();",
              "    this.wsStopping = false;\n    this.wsReconnectBlocked = false;\n    this.connectWs();\n\n    void this.scan();"
          )

          text = text.replace(
              "  public stop() {\n    if (this.scanTimer)",
              "  public stop() {\n    this.wsStopping = true;\n    if (this.wsReconnectTimer) {\n      clearTimeout(this.wsReconnectTimer);\n      this.wsReconnectTimer = null;\n    }\n    if (this.scanTimer)"
          )

          old_connect = re.compile(r"  private connectWs\(\) \{.*?\n  private handleWsMessage\(m: any\) \{", re.S)
          new_connect = '''  private connectWs() {
    if (this.wsStopping || this.wsReconnectBlocked) return;

    const targetWsUrl =
      this.sessionInfo.session === 'OVERNIGHT'
        ? 'wss://stream.data.alpaca.markets/v1beta1/overnight'
        : `wss://stream.data.alpaca.markets/v2/${this.feed}`;

    if (this.ws) {
      if (this.currentWsUrl === targetWsUrl) {
        return;
      }
      try {
        this.ws.close();
      } catch {}
      this.ws = null;
      this.auth = false;
    }

    if (this.wsReconnectTimer) {
      clearTimeout(this.wsReconnectTimer);
      this.wsReconnectTimer = null;
    }

    this.currentWsUrl = targetWsUrl;
    console.log(`[JFIRE] Connecting WebSocket to ${targetWsUrl} (session: ${this.sessionInfo.session})`);
    const ws = new WebSocket(targetWsUrl);
    this.ws = ws;

    ws.on('open', () => {
      ws.send(JSON.stringify({ action: 'auth', key: this.key, secret: this.secret }));
    });

    ws.on('message', (data) => {
      try {
        const msgs = JSON.parse(data.toString());
        if (Array.isArray(msgs)) {
          for (const m of msgs) {
            this.handleWsMessage(m);
          }
        }
      } catch (err: any) {
        console.error('[JFIRE] WS parse error:', err.message);
      }
    });

    ws.on('close', () => {
      if (this.ws !== ws) return;
      this.ws = null;
      this.auth = false;

      if (this.wsStopping || this.wsReconnectBlocked) return;

      this.wsReconnectTimer = setTimeout(() => {
        this.wsReconnectTimer = null;
        this.connectWs();
      }, 5000);
    });

    ws.on('error', (err: any) => {
      console.error('[JFIRE] WS error:', err.message);
    });
  }

  private handleWsMessage(m: any) {'''
          text, count = old_connect.subn(new_connect, text, count=1)
          if count != 1:
              raise SystemExit('scanner connectWs block not found')

          auth_old = "      this.auth = true;\n      console.log(`[JFIRE] Alpaca WebSocket authenticated successfully (${this.getActiveFeedName()})`);"
          auth_new = "      this.auth = true;\n      this.wsReconnectBlocked = false;\n      this.wsReconnectAttempt = 0;\n      console.log(`[JFIRE] Alpaca WebSocket authenticated successfully (${this.getActiveFeedName()})`);"
          if auth_old not in text:
              raise SystemExit('scanner auth block not found')
          text = text.replace(auth_old, auth_new, 1)

          err_old = """    if (m?.T === 'error') {
      console.error('[JFIRE] WS error message received:', m);
      this.diagnostics.wsLastError = `${m.code}: ${m.msg}`;
      return;
    }"""
          err_new = """    if (m?.T === 'error') {
      console.error('[JFIRE] WS error message received:', m);
      this.diagnostics.wsLastError = `${m.code}: ${m.msg}`;

      if (Number(m.code) === 406) {
        // Alpaca connection-limit errors must not trigger the normal 5s reconnect loop.
        // Back off exponentially so an account-level connection limit is not hammered.
        this.wsReconnectBlocked = true;
        if (this.wsReconnectTimer) {
          clearTimeout(this.wsReconnectTimer);
          this.wsReconnectTimer = null;
        }
        const delayMs = Math.min(300000, 60000 * 2 ** this.wsReconnectAttempt);
        this.wsReconnectAttempt += 1;
        console.warn(
          `[JFIRE] Alpaca connection limit (406). Pausing WebSocket reconnect for ${Math.round(delayMs / 1000)}s.`
        );
        try {
          this.ws?.close(1000, 'Alpaca connection limit');
        } catch {}
        this.wsReconnectTimer = setTimeout(() => {
          this.wsReconnectTimer = null;
          if (this.wsStopping) return;
          this.wsReconnectBlocked = false;
          this.connectWs();
        }, delayMs);
      }
      return;
    }"""
          if err_old not in text:
              raise SystemExit('scanner error block not found')
          text = text.replace(err_old, err_new, 1)
          scanner.write_text(text, encoding='utf-8')

          news = Path('src/news-engine.ts')
          text = news.read_text(encoding='utf-8')

          text = text.replace(
              "  private reconnectTimer: any = null;\n  private reactionUpdateTimer",
              "  private reconnectTimer: ReturnType<typeof setTimeout> | null = null;\n  private reconnectAttempt = 0;\n  private reconnectBlocked = false;\n  private stopping = false;\n  private reactionUpdateTimer",
              1,
          )

          text = text.replace(
              "  public async start() {\n    this.connect();",
              "  public async start() {\n    this.stopping = false;\n    this.reconnectBlocked = false;\n    this.connect();",
              1,
          )

          text = text.replace(
              "  public stop() {\n    if (this.reconnectTimer)",
              "  public stop() {\n    this.stopping = true;\n    if (this.reconnectTimer)",
              1,
          )

          connect_re = re.compile(r"  private connect\(\) \{.*?\n  private handleMessage\(m: any\) \{", re.S)
          connect_new = '''  private connect() {
    if (this.stopping || this.reconnectBlocked) return;

    if (this.ws) {
      try {
        this.ws.close();
      } catch {}
      this.ws = null;
    }

    const wsUrl = 'wss://stream.data.alpaca.markets/v1beta1/news';
    console.log(`[JFIRE NEWS] Connecting to Alpaca News stream: ${wsUrl}`);
    const ws = new WebSocket(wsUrl);
    this.ws = ws;

    ws.on('open', () => {
      console.log('[JFIRE NEWS] News WebSocket connected, authenticating...');
      ws.send(JSON.stringify({ action: 'auth', key: this.key, secret: this.secret }));
    });

    ws.on('message', (raw) => {
      try {
        const msgs = JSON.parse(raw.toString());
        if (Array.isArray(msgs)) {
          for (const m of msgs) {
            this.handleMessage(m);
          }
        } else if (msgs && typeof msgs === 'object') {
          this.handleMessage(msgs);
        }
      } catch (err: any) {
        console.error('[JFIRE NEWS] Message parse error:', err.message);
      }
    });

    ws.on('error', (err) => {
      console.error('[JFIRE NEWS] WebSocket error:', err.message);
      this.lastError = err.message;
    });

    ws.on('close', (code, reason) => {
      if (this.ws !== ws) return;
      this.ws = null;
      this.isConnected = false;
      this.emitNewsStatus();

      if (this.stopping || this.reconnectBlocked) return;

      console.warn(`[JFIRE NEWS] WebSocket closed (${code}: ${reason.toString()}). Reconnecting in 5s...`);
      if (this.reconnectTimer) clearTimeout(this.reconnectTimer);
      this.reconnectTimer = setTimeout(() => {
        this.reconnectTimer = null;
        this.connect();
      }, 5000);
    });
  }

  private handleMessage(m: any) {'''
          text, count = connect_re.subn(connect_new, text, count=1)
          if count != 1:
              raise SystemExit('news connect block not found')

          auth_old = "      this.isConnected = true;\n      this.lastError = null;"
          auth_new = "      this.isConnected = true;\n      this.reconnectBlocked = false;\n      this.reconnectAttempt = 0;\n      this.lastError = null;"
          if auth_old not in text:
              raise SystemExit('news auth block not found')
          text = text.replace(auth_old, auth_new, 1)

          err_old = """    if (m.T === 'error') {
      console.error(`[JFIRE NEWS] Alpaca error (${m.code}): ${m.msg}`);
      this.lastError = `${m.code}: ${m.msg}`;
      this.emitNewsStatus();
      return;
    }"""
          err_new = """    if (m.T === 'error') {
      console.error(`[JFIRE NEWS] Alpaca error (${m.code}): ${m.msg}`);
      this.lastError = `${m.code}: ${m.msg}`;
      this.emitNewsStatus();

      if (Number(m.code) === 406) {
        // Alpaca connection-limit errors must not trigger the normal 5s reconnect loop.
        this.reconnectBlocked = true;
        if (this.reconnectTimer) {
          clearTimeout(this.reconnectTimer);
          this.reconnectTimer = null;
        }
        const delayMs = Math.min(300000, 60000 * 2 ** this.reconnectAttempt);
        this.reconnectAttempt += 1;
        console.warn(
          `[JFIRE NEWS] Alpaca connection limit (406). Pausing WebSocket reconnect for ${Math.round(delayMs / 1000)}s.`
        );
        try {
          this.ws?.close(1000, 'Alpaca connection limit');
        } catch {}
        this.reconnectTimer = setTimeout(() => {
          this.reconnectTimer = null;
          if (this.stopping) return;
          this.reconnectBlocked = false;
          this.connect();
        }, delayMs);
      }
      return;
    }"""
          if err_old not in text:
              raise SystemExit('news error block not found')
          text = text.replace(err_old, err_new, 1)
          news.write_text(text, encoding='utf-8')

          final_ci = '''name: Validate JFire Scanner

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
'''
          Path('.github/workflows/ci.yml').write_text(final_ci, encoding='utf-8')

      - name: Commit repaired branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scanner-engine.ts src/news-engine.ts .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: back off Alpaca WebSocket connection-limit reconnects"
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
