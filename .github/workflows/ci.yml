name: Validate JFire Scanner

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck client
        id: typecheck_client
        continue-on-error: true
        run: |
          set +e
          npm run typecheck -- --pretty false --noErrorTruncation > typecheck-client.log 2>&1
          code=$?
          cat typecheck-client.log
          exit $code
      - name: Typecheck server
        id: typecheck_server
        continue-on-error: true
        run: |
          set +e
          npm run typecheck:node -- --pretty false --noErrorTruncation > typecheck-server.log 2>&1
          code=$?
          cat typecheck-server.log
          exit $code
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck-*.log
          if-no-files-found: ignore
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Fail validation if any check failed
        if: always()
        run: |
          if [ "${{ steps.typecheck_client.outcome }}" != "success" ] || \
             [ "${{ steps.typecheck_server.outcome }}" != "success" ] || \
             [ "${{ steps.lint.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "One or more validation checks failed."
            exit 1
          fi
